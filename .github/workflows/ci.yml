name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint · types · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint (web)
        run: npm run lint --workspace web
      - name: Typecheck (@bpmap/shared + web)
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Contrôle d'intégrité des données
        run: npm run check:data
      - name: Palette des genres synchronisée avec globals.css
        run: npm run check:genre-css --workspace web
      - name: Build (web)
        run: npm run build --workspace web

  mobile:
    name: App mobile — types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Générer expo-env.d.ts
        working-directory: appMobile
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - name: Typecheck (appMobile)
        working-directory: appMobile
        run: npx tsc --noEmit

name: Mise à jour quotidienne des festivals

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: donnees-quotidiennes
  cancel-in-progress: false

env:
  REQUIRED_CHECK_CONTEXT: "Web — lint · types · build"

jobs:
  update:
    name: Ingestion · vérification · publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Instantané des données avant ingestion
        run: cp shared/src/data/festivals.json "$RUNNER_TEMP/festivals-avant.json"

      - name: Ingestion (Wikidata + OpenAgenda + RA + DICE + DATAtourisme) → candidats
        run: node web/scripts/ingest.mjs
        env:
          DATATOURISME_FLUX_URL: ${{ secrets.DATATOURISME_FLUX_URL }}

      - name: Vérification automatique + promotion (croisement de sources)
        run: node web/scripts/verify-promote.mjs

      - name: Enrichissement des line-ups via Resident Advisor
        run: node web/scripts/ra-lineups.mjs

      - name: Prix & line-ups Shotgun (navigateur headless, fail-open)
        run: node web/scripts/shotgun-update.mjs

      - name: Géocodage (régénère shared/src/data/festivals.json via la BAN)
        run: npm run geocode --workspace web

      - name: Contrôle d'intégrité des données
        run: npx tsx web/scripts/check-data.mjs "$RUNNER_TEMP/festivals-avant.json" shared/src/data/festivals.json

      - name: Journal des changements (diff vs version committée → changes.json)
        run: npx tsx web/scripts/diff-changes.mjs
        env:
          PREV_FESTIVALS_PATH: ${{ runner.temp }}/festivals-avant.json

      - name: Lint (web)
        run: npm run lint --workspace web

      - name: Typecheck (@bpmap/shared + web)
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build (web)
        run: npm run build --workspace web

      - name: Migrations Neon (idempotentes)
        run: node web/scripts/db-migrate.mjs
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}

      - name: Charger dans Neon
        run: node web/scripts/db-load.mjs
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}

      - name: Cycle de vie (marque "passé" + purge à +1 mois)
        run: node web/scripts/db-lifecycle.mjs
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}

      - name: Notifications push (changements du jour → Expo Push)
        run: node web/scripts/send-push.mjs
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}

      - name: Ouvrir la PR de rafraîchissement (auto-merge après contrôle)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-data-refresh.sh
